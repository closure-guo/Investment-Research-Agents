[project]
name = "investment-research-agents"
version = "0.1.0"
description = "AI-powered financial analysis report system for A-share stocks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.0",
    "pandas>=2.0.0",
    "litellm>=1.0.0",
    "akshare>=1.18.63",
    "pyarrow>=24.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "matplotlib>=3.8.0",
    "ddgs>=7.0",
    "langfuse>=4.0.0",
    "tavily-python>=0.7.26",
    "python-dotenv>=1.2.2",
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0",
    "apscheduler>=3.11.3",
    "weasyprint>=62.0",
    "ag-ui-protocol==0.1.21",
    "pypdf>=5.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# 默认只跑单元/集成测试：tests/e2e 用 Playwright 同步 API（session 级 browser fixture），
# 与 asyncio_mode=auto 的 pytest-asyncio 冲突--e2e 先跑会使后续 async 测试抛
# "Runner.run() cannot be called from a running event loop"（issue #35）。
# e2e 需单独执行：uv run pytest tests/e2e/（与 CI 分层一致，见 .github/workflows/ci.yml）
testpaths = ["tests"]
norecursedirs = ["tests/e2e", "tests/scripts"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live: 真实 LLM 链路测试（需 DEEPSEEK_API_KEY，nightly 触发，不进 PR 门禁）",
    "fault_regression: 故障注入回归集（add-fault-injection-regression-set，确定性零 token）",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "W",   # pycodestyle warnings
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]
ignore = ["E501", "N806"]  # line-too-long (handled by formatter); N806: camelCase 命名规则（用户红线）

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S310"]  # pytest uses assert; test scripts use urllib
"tests/e2e/**/*.py" = ["S101", "S310", "S602", "S603", "S607", "E402", "F841", "SIM102", "SIM105"]  # E2E 脚本用 subprocess 管理服务，预存 lint 问题不修
"tests/scripts/**/*.py" = ["S101", "S310", "S608", "E402", "N", "B007", "S110", "F841"]  # 调试/验证脚本，命名规范放宽

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
files = ["src"]  # 裸 `uv run mypy` 的默认目标（#251）；evals/tests 按需显式传参（evals 另有 9 项存量债务）
mypy_path = "src"  # src 布局:editable 安装是路径 .pth,mypy 不跟踪,显式声明保证 evals/ 等任意目标可解析 finance_agent
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "playwright>=1.60.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.23.0",
    "pandas-stubs~=3.0.3",
]
