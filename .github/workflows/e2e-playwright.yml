name: E2E Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每天 UTC 18:00（北京时间次日 02:00）--触发 @live nightly
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  # stub 套件：PR/push 触发，确定性，秒级-分钟级
  stub:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # stub suite ~1.5 分钟；timeline suite 拉起 6 个 webServer（3 端口对）+
    # STUB_NODE_DELAY=1.5s 的 5 层管线，实际运行 ~12 分钟，预留余量放宽到 25 分钟
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --group dev

      - name: Secret leak scan
        run: uv run python tests/scripts/check_secrets.py

      - name: Install CJK fonts (matplotlib charts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          # WeasyPrint 系统库（libpango/libgdk-pixbuf/shared-mime-info），与 Dockerfile 运行时容器保持一致
          sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info
          # 清除 matplotlib 字体缓存，使新安装的字体生效
          rm -rf ~/.cache/matplotlib /home/runner/.cache/matplotlib

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/e2e/playwright/package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps
        working-directory: tests/e2e/playwright

      # Playwright webServer 自动拉起前后端（TESTING=1）
      - name: Run Playwright E2E (stub suite)
        run: npx playwright test
        working-directory: tests/e2e/playwright
        env:
          CI: "true"

      # 战绩页·跑赢指数对比（专属 config + 独立测试库，避免造数污染共享库空态前提）
      - name: Run Playwright E2E (track-record suite)
        run: npx playwright test --config=playwright.track-record.config.ts
        working-directory: tests/e2e/playwright
        env:
          CI: "true"

      # 评估运维分区（专属 config + 独立端口对 8005/5178 + 独立测试库）：
      # 手动补跑用例服务端同步执行 20-60s，在默认套件并行会独占单进程后端致
      # 流式用例随机红（issue #252）——物理隔离后默认套件恢复并行门禁
      - name: Run Playwright E2E (eval-ops suite)
        run: npx playwright test --config=playwright.eval-ops.config.ts
        working-directory: tests/e2e/playwright
        env:
          CI: "true"

      # 时间序列 E2E（专属 config，STUB_SCENARIO=tool_call/pipeline，独立端口对）
      - name: Run Playwright E2E (timeline suite)
        run: npx playwright test --config=playwright.timeline.config.ts
        working-directory: tests/e2e/playwright
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright/playwright-report/
          retention-days: 7

  # @live 套件：nightly 触发，真 LLM，防 stub 漂移
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --group dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Run @live E2E tests
        run: uv run pytest -m live -x -q
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # @live 为显式 opt-in（#158）：本地全量跑批即使凭据泄漏进环境也不触发
          # live 用例；nightly 跑批在此显式开启。
          RUN_LIVE: "1"
          # nightly @live 门禁（FM 决策/性能基线/Judge 校准导出）依赖 Langfuse；
          # 未配置对应 secrets 时为空 → live 用例按「无 key 跳过」纪律自动跳过（见
          # calibrate-fm-approval 4.2 / add-latency-cost-regression 4.2）。管理员配置：
          # 仓库 Settings → Secrets → LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_HOST
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST || 'http://localhost:3000' }}
