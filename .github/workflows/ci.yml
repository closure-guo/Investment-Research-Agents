name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每天 UTC 19:30（北京 03:30）——与 e2e nightly（18:00 UTC）错峰；跑全历史密钥扫描
    - cron: '30 19 * * *'
  workflow_dispatch:

# 同分支并发取消（update-ci-pipeline R1）：连推同一分支时取消在跑的旧 run，分钟不叠加。
# 手动 workflow_dispatch 同受组约束（design 已声明为预期行为）。
# schedule 豁免（与 e2e nightly 同旨）：历史扫描是唯一"全历史"信号，不得被普通 push 的 run 取消。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  lint-and-test:
    # schedule 触发时只跑 history-secret-scan（不整夜重复全量套件）
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CJK fonts
        # CI runner（ubuntu-latest）默认无 CJK 字体，charts 字体回退链测试需命中
        # fonts-noto-cjk；与 Dockerfile 中运行时容器的字体安装保持一致
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk && sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Secret leak scan
        # 扫描器本体 + 其守门测试（tests/scripts 整目录因个别用例需后端服务被单测步排除，
        # 本文件纯 stdlib/离线，显式在此跑，防扫描器回归失守）
        run: |
          uv run python tests/scripts/check_secrets.py
          uv run pytest tests/scripts/test_check_secrets.py -q

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: MyPy
        run: uv run mypy src/ || true  # third-party stub issues (docx, pptx, langgraph)

      # fail-fast 排序（update-ci-pipeline R2）：前端单测与 CI 脚本桩件测试先于后端
      # pytest 执行——最快的失败最先反馈；两者零后端依赖。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # @live 失败上报逻辑的桩件测试（update-ci-pipeline R5 配套）：node 内置
      # test runner，零依赖秒级（node --test 需 ≥18；runner 为 20）
      - name: CI helper script tests (node --test)
        run: node --test scripts/ci/report_live_failure.test.cjs

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # 时序硬化（issue #331，已修复）：followup-resume-after-switch 原用固定
      # setTimeout 赌事件链时点，在 CI（2 vCPU Linux）偶发超时——已改为条件等待
      # （等思考/工具/对侧会话渲染到稳定态），exclude 随之移除、全量文件入门禁。
      # --retry=1 与 Playwright 套件 retries=1 同口径：只吸收抖动，确定性回归两次都失败。
      - name: Frontend unit tests (vitest)
        run: npm test -- --retry=1
        working-directory: frontend

      - name: Unit tests
        run: uv run pytest tests/ --ignore=tests/scripts -m "not live" -x -q

      # 校验器回归门禁（baseline-v2 r3 事故教训）：v1.1 标签构造即标签、纯离线，
      # 无需 Langfuse 凭据；F1 < 0.90 或相对冻结基线退步 > 0.02 即 exit 1
      - name: Verifier accuracy regression gate
        run: uv run python evals/claim_benchmark/measure.py --labeled evals/claim_benchmark/data/benchmark_v12.jsonl --gate 0.90 --baseline evals/claim_benchmark/results/v12-measure.json

      # golden 集断言门禁（add-golden-set-assertion-types）：真实来源事故回归 +
      # T6 拒答 + T8 合规，deterministic 零 token；全 PASS 才绿
      - name: Golden set gate (assertion-level, deterministic)
        run: uv run python -m evals.golden.gates

      # 故障注入回归集（add-fault-injection-regression-set）：七轮评审故障样本
      # （v5 推理泄露 / v2 报警外露 / 期次错位撞车）守卫拒绝断言，确定性零 token；
      # prompt/模型/校验器变更后守卫被削弱即红
      - name: Fault injection regression gate
        run: uv run pytest tests/regression/fault_injection -m fault_regression -q

  # 全历史密钥扫描（tests/scripts/check_secrets.py --history）：当前树扫描看不见
  # "提交后删除"的历史泄露——本仓库两次真实泄露（已吊销）恰属后者。nightly + 手动触发；
  # 纯 stdlib + git，无需装依赖（故不引 uv）。判定口径：已知吊销项/占位符报告不判失败，
  # 其余命中（新/未知密钥形态）即红。
  history-secret-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全历史必需（默认 depth=1 只有单提交，历史扫描会空转）

      - name: Scan full git history for secrets
        run: python3 tests/scripts/check_secrets.py --history
