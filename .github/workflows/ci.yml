name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CJK fonts
        # CI runner（ubuntu-latest）默认无 CJK 字体，charts 字体回退链测试需命中
        # fonts-noto-cjk；与 Dockerfile 中运行时容器的字体安装保持一致
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk && sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Secret leak scan
        run: uv run python tests/scripts/check_secrets.py

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: MyPy
        run: uv run mypy src/ || true  # third-party stub issues (docx, pptx, langgraph)

      - name: Unit tests
        run: uv run pytest tests/ --ignore=tests/scripts -m "not live" -x -q

      # 校验器回归门禁（baseline-v2 r3 事故教训）：v1.1 标签构造即标签、纯离线，
      # 无需 Langfuse 凭据；F1 < 0.90 或相对冻结基线退步 > 0.02 即 exit 1
      - name: Verifier accuracy regression gate
        run: uv run python evals/claim_benchmark/measure.py --labeled evals/claim_benchmark/data/benchmark_v12.jsonl --gate 0.90 --baseline evals/claim_benchmark/results/v12-measure.json

      # golden 集断言门禁（add-golden-set-assertion-types）：真实来源事故回归 +
      # T6 拒答 + T8 合规，deterministic 零 token；全 PASS 才绿
      - name: Golden set gate (assertion-level, deterministic)
        run: uv run python -m evals.golden.gates

      # 故障注入回归集（add-fault-injection-regression-set）：七轮评审故障样本
      # （v5 推理泄露 / v2 报警外露 / 期次错位撞车）守卫拒绝断言，确定性零 token；
      # prompt/模型/校验器变更后守卫被削弱即红
      - name: Fault injection regression gate
        run: uv run pytest tests/regression/fault_injection -m fault_regression -q
